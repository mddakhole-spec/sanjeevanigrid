server:
  port: 8080

spring:
  application:
    name: sanjeevanigrid
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sanjeevanigrid}
    username: ${DB_USER:sanjeevanigrid}
    password: ${DB_PASS:sanjeevanigrid}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:c2FuamVldmFuaWdyaWQtand0LXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LW9ubHktbm90LWZvci1wcm9kdWN0aW9u}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  otp:
    sandbox: true
    sandbox-code: "123456"
    expiry-minutes: 5
    max-attempts: 5
  mode: sandbox
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:mock_bot_token}
    chat-id: ${TELEGRAM_CHAT_ID:mock_chat_id}
  blood:
    cooldown-days: 90
    default-search-radius-km: 35.0
    default-low-stock-threshold: 5

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
